<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小P · 《Python开发》智能学伴</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--main:#2f6fed;--main-d:#1f4fbf;--ink:#1c2333;--sub:#6b7385;--line:#e6eaf2;--user:#2f6fed}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,#2f6fed,#5a8bff);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex:none}
  .avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--main);font-weight:700;font-size:18px;display:grid;place-items:center}
  header h1{font-size:16px;margin:0}
  header p{margin:2px 0 0;font-size:12px;opacity:.85}
  #log{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
  .row.me{flex-direction:row-reverse}
  .bub{max-width:82%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.65;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(20,30,60,.04)}
  .row.me .bub{background:var(--user);color:#fff;border-color:var(--user)}
  .mini{width:28px;height:28px;border-radius:50%;background:#e7eeff;color:var(--main);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
  .tip{text-align:center;font-size:12px;color:var(--sub)}
  .tip button{color:var(--main);background:none;border:none;font-size:12px;text-decoration:underline;padding:4px 8px}
  code{background:#eef1f7;padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  pre{background:#0f1729;color:#d6e2ff;padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.5}
  pre code{background:none;color:inherit;padding:0}
  .warn{background:#fff7e6;border:1px solid #ffe2a8;color:#8a5b00;font-size:13px;padding:10px 12px;border-radius:12px}
  #chips{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;flex:none;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:#fff;border:1px solid var(--line);color:var(--main);border-radius:999px;padding:8px 13px;font-size:13px}
  form{flex:none;display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  #q{flex:1;border:1px solid var(--line);background:#f7f9fc;border-radius:999px;padding:11px 15px;font-size:16px;outline:none}
  #q:focus{border-color:var(--main)}
  button.send{background:var(--main);color:#fff;border:none;border-radius:999px;padding:0 18px;font-size:15px;font-weight:600}
  button.send:disabled{opacity:.5}
  .cursor::after{content:"▋";animation:b .7s steps(2) infinite}
  @keyframes b{50%{opacity:0}}
</style>
</head>
<body>
<header>
  <div class="avatar">P</div>
  <div>
    <h1>小P · 《Python开发》智能学伴</h1>
    <p>启发式答疑 · 不代写作业 · 回答依据课程知识库</p>
  </div>
</header>

<div id="log">
  <div class="row"><div class="mini">P</div><div class="bub">你好，我是小P 👋<br>我在《Python开发》这门课里陪你敲代码：语法、报错、思路都可以问我。<br>但作业我不会替你写，我会带你一步步想明白。先说说你卡在哪？</div></div>
  <div class="warn" id="demoWarn" style="display:none">当前是<b>示例模式</b>：还没配置大模型 Key，回答仅来自内置知识库片段。部署时在项目环境变量里加上 <code>LLM_KEY</code> 后重新部署即可启用真模型。</div>
</div>

<div id="chips">
  <button class="chip">pandas 读 CSV 中文乱码怎么办</button>
  <button class="chip">函数的默认参数为什么不能用 []</button>
  <button class="chip">try-except 应该怎么写才规范</button>
  <button class="chip">帮我写完 Python 期末大作业</button>
</div>

<form id="f">
  <input id="q" placeholder="问小P点什么…" autocomplete="off" enterkeyhint="send">
  <button class="send" type="submit">发送</button>
</form>

<script>
const log=document.getElementById('log'),f=document.getElementById('f'),q=document.getElementById('q');
const history=[];
function fmt(s){const esc=s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  return esc.replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/`([^`]+?)`/g,'<code>$1</code>');}
function add(role,text){const row=document.createElement('div');row.className='row'+(role==='user'?' me':'');
  row.innerHTML=(role==='user'?'':'<div class="mini">P</div>')+'<div class="bub">'+fmt(text)+'</div>';
  log.appendChild(row);scroll();return row.querySelector('.bub');}
function scroll(){requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight));log.scrollTop=log.scrollHeight+200;}
function busy(on){q.disabled=on;document.querySelector('.send').disabled=on;}

async function ask(text){
  add('user',text);history.push({role:'user',content:text});busy(true);
  const bub=add('assistant','');bub.classList.add('cursor');let acc='';
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:history})});
    if(!res.ok||!res.body)throw new Error('HTTP '+res.status);
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n');buf=parts.pop();
      for(const p of parts){const ev=(p.match(/event: (\w+)/)||[])[1];
        const data=(p.match(/data: ([\s\S]*)/)||[])[1];if(!data)continue;const d=JSON.parse(data);
        if(ev==='token'){acc+=d.t;bub.innerHTML=fmt(acc);scroll();}
        else if(ev==='done'){if(d.demo)document.getElementById('demoWarn').style.display='block';}
        else if(ev==='error'){acc+='\n\n⚠️ '+d.msg;bub.innerHTML=fmt(acc);}}}
  }catch(e){acc='网络开小差了，稍后再试一次？（'+e.message+'）';bub.innerHTML=fmt(acc);}
  bub.classList.remove('cursor');history.push({role:'assistant',content:acc});busy(false);q.focus();
}
f.onsubmit=e=>{e.preventDefault();const t=q.value.trim();if(!t)return;q.value='';ask(t);};
document.getElementById('chips').onclick=e=>{if(e.target.classList.contains('chip'))ask(e.target.textContent);};
fetch('/api/health').then(r=>r.json()).then(d=>{if(!d.llm)document.getElementById('demoWarn').style.display='block';}).catch(()=>{});
window.onload=()=>q.focus();
</script>
</body>
</html>
